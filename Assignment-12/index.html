<!DOCTYPE html>
<html>
<head>
  <title>Assignment 12 - Conditional Rendering & Scroll</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function UserProfile({ user }) {
      const [isEditing, setIsEditing] = useState(false);
      const [name, setName] = useState(user.name);
      const [bio, setBio] = useState(user.bio);

      return (
        <div style={{ border: '1px solid #999', padding: '15px', width: '280px', margin: '15px auto', fontFamily: 'sans-serif' }}>
          {isEditing ? (
            <div>
              <h3>Edit Profile</h3>
              <label>Name:</label><br />
              <input type="text" value={name} onChange={(e) => setName(e.target.value)} /><br /><br />
              <label>Bio:</label><br />
              <input type="text" value={bio} onChange={(e) => setBio(e.target.value)} /><br /><br />
              <button onClick={() => setIsEditing(false)}>Save</button>
            </div>
          ) : (
            <div>
              <h3>User Profile</h3>
              <p><b>Name:</b> {name}</p>
              <p><b>Bio:</b> {bio}</p>
              <button onClick={() => setIsEditing(true)}>Edit Profile</button>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const user = { name: "Bhakti", bio: "Learning React step by step" };

      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div style={{ fontFamily: 'sans-serif', padding: '20px' }}>
          <h2 style={{ textAlign: 'center' }}>Assignment 12 - Ternary Operator & Scroll to Top</h2>
          <UserProfile user={user} />
          <div style={{ marginTop: '40px', background: '#f9f9f9', padding: '15px' }}>
            <p>Scroll down to test Scroll to Top...</p>
            <div style={{ height: '350px' }}></div>
            <button onClick={scrollToTop} style={{ padding: '8px 16px', cursor: 'pointer' }}>
              Scroll To Top ↑
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
