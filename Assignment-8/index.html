<!DOCTYPE html>
<html>
<head>
  <title>Assignment 8 - Classes in JS</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .box { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; width: 400px; }
    button { padding: 5px 10px; margin-top: 5px; }
  </style>
</head>
<body>

  <h2>Assignment 8 - JavaScript Classes</h2>

  <div class="box">
    <h4>1. Calculator Class</h4>
    <button onclick="testCalculator()">Run Calculator Demo</button>

  </div>

  <div class="box">
    <h4>2. Biggest Class</h4>
    <button onclick="testBiggest()">Find Largest in [10, 45, 23, 89, 12]</button>
    <p id="bigRes"></p>
  </div>

  <div class="box">
    <h4>3. Rectangle Class</h4>

    <p id="rectRes"></p>
  </div>

  <script src="script.js"></script>

</html>
