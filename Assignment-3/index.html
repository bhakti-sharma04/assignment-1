<!DOCTYPE html>
<html>
<head>
  <title>Assignment 3 - Profile with CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="header">
    <h1>Student Profile</h1>
  </div>

  <div class="profile-box">
    <img id="my-photo" src="https://via.placeholder.com/130" alt="Profile Picture">
    <h2 class="name-text">Bhakti</h2>
    <p class="role-text">BCA Student</p>

    <div class="info-section">
      <h3>About Me</h3>
      <p>I am a student learning HTML, CSS, JavaScript, and React.</p>
    </div>

    <div class="info-section">
      <h3>My Details</h3>
      <p><b>Email:</b> bhakti@gmail.com</p>
      <p><b>City:</b> Mumbai</p>
    </div>

    <div class="info-section">
      <h3>Education</h3>
      <table id="edu-table">
        <tr>
          <th>Standard</th>
          <th>Percentage</th>
        </tr>
        <tr>
          <td>10th</td>
          <td>85%</td>
        </tr>
        <tr>
          <td>12th</td>
          <td>80%</td>
        </tr>
      </table>
    </div>
  </div>

</body>
</html>
